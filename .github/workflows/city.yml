name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow duckdb pytest ruff
      - name: Lint with ruff
        run: ruff check test_etl.py
      - name: Run ETL Tester
        run: pytest test_etl.py test_jan2024.py -v
